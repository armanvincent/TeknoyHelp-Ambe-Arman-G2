{% extends 'base.html' %}
{% block title %}Register | TeknoyHelp{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Create your account</h3>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'accounts/_form.html' %}
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
